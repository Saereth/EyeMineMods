plugins {
    id "com.matthewprenger.cursegradle" version "1.4.0"
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Cloth Config for Fabric config GUI
    implementation "curse.maven:cloth-config-348521:7817582"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

if (System.getenv("CURSEFORGE_TOKEN")) {
    def cfReleaseType = rootProject.version.toString().contains("alpha") ? "alpha" :
                        rootProject.version.toString().contains("beta") ? "beta" : "release"

    curseforge {
        apiKey = System.getenv("CURSEFORGE_TOKEN")
        project {
            id = rootProject.curseforge_id
            changelog = rootProject.file("changes.md").text
            changelogType = "markdown"
            releaseType = cfReleaseType
            addGameVersion rootProject.minecraft_version
            addGameVersion "Fabric"
            addGameVersion "Java ${rootProject.java_version}"
            mainArtifact(tasks.named("jar").get()) {
                displayName = "eyemine-${rootProject.minecraft_version}-fabric-${rootProject.version.toString()}"
            }
            relations {
                requiredDependency "fabric-api"
                requiredDependency "cloth-config"
            }
        }
        options {
            forgeGradleIntegration = false
            javaVersionAutoDetect = false
        }
    }
}
